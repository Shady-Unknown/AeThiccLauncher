name: Mirror gold issue to Discord

# Mirrors ONE issue (the gold-tier proposals issue) to a Discord channel through
# a webhook. Everything else (commits, releases, the general issues channel) is
# handled by Discord's own GitHub integration, so this file only covers the
# single-issue case that the integration cannot filter.
#
# Repository configuration (Settings -> Secrets and variables -> Actions):
#   secret  DISCORD_WEBHOOK_GOLD  webhook URL of the gold proposals channel
#   var     GOLD_ISSUE_NUMBER     number of that issue (from .../issues/<number>)
#
# Without them the job is skipped: nothing is posted and nothing breaks.

on:
  issues:
    types: [opened, edited, reopened, closed, deleted, labeled, unlabeled, assigned]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read

# Keep events of the same issue in order so comments are not mirrored out of
# sequence when several arrive at once.
concurrency:
  group: discord-gold-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  mirror:
    # Pull requests also fire `issues` events; they are ignored. The second
    # condition compares as text so an empty variable simply disables the job.
    if: >
      github.event.issue.pull_request == null &&
      format('{0}', github.event.issue.number) == vars.GOLD_ISSUE_NUMBER
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          GOLD_ISSUE_NUMBER: ${{ vars.GOLD_ISSUE_NUMBER }}
          WEBHOOK_GOLD: ${{ secrets.DISCORD_WEBHOOK_GOLD }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          MAX_BODY = 1200
          COLOR_GOLD = 0xE6B800

          payload = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          event = os.environ.get("EVENT_NAME", "")
          action = os.environ.get("EVENT_ACTION", payload.get("action", ""))
          issue = payload.get("issue") or {}
          number = issue.get("number")

          # Belt and braces: the job `if` already filters by issue number.
          gold = os.environ.get("GOLD_ISSUE_NUMBER", "").strip()
          if not number or str(number) != gold:
              print(f"issue #{number} is not the gold issue (#{gold}), nothing to do")
              sys.exit(0)


          def snippet(text):
              text = (text or "").replace("\r\n", "\n").strip()
              if len(text) > MAX_BODY:
                  text = text[:MAX_BODY].rstrip() + "…"
              return text


          if event == "issue_comment":
              comment = payload.get("comment") or {}
              author = (comment.get("user") or {}).get("login", "unknown")
              title = f"Gold issue #{number} · comment {action} by {author}"
              url = comment.get("html_url") or issue.get("html_url", "")
              body = snippet(comment.get("body", ""))
              fields = []
          else:
              author = (issue.get("user") or {}).get("login", "unknown")
              title = f"Gold issue #{number} {action}: {issue.get('title', '')}"[:250]
              url = issue.get("html_url", "")
              body = "" if action == "deleted" else snippet(issue.get("body", ""))
              labels = ", ".join(label["name"] for label in issue.get("labels", [])) or "—"
              fields = [
                  {"name": "State", "value": issue.get("state", "unknown"), "inline": True},
                  {"name": "Author", "value": author, "inline": True},
                  {"name": "Labels", "value": labels[:1000], "inline": False},
              ]

          embed = {"title": title, "url": url, "color": COLOR_GOLD, "fields": fields}
          if body:
              embed["description"] = body

          webhook = os.environ.get("WEBHOOK_GOLD", "").strip()
          if not webhook:
              print("::warning::DISCORD_WEBHOOK_GOLD is not set, skipping")
              sys.exit(0)

          request = urllib.request.Request(
              webhook,
              data=json.dumps(
                  {
                      "username": "Ae Thicc Gold",
                      "allowed_mentions": {"parse": []},
                      "embeds": [embed],
                  }
              ).encode("utf-8"),
              headers={"Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  print(f"posted ({response.status})")
          except Exception as exc:  # noqa: BLE001 - never break issue activity
              print(f"::warning::post failed ({exc})")
          PY
