name: Build and Publish Ae Thicc Launcher

# Si attiva solo ai push sul ramo principale
on:
  push:
    branches:
      - main # Cambia in "master" se il tuo ramo si chiama così

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. BUILD WINDOWS (.exe e zip)
  # ==========================================
  build-windows:
    # Esegue il job SOLO se il messaggio del commit inizia con "Release_"
    if: startsWith(github.event.head_commit.message, 'Release_')
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Assicurati che combaci con la tua versione

      - name: Prepare Virtual Environment
        # Creiamo un finto .venv per soddisfare il blocco di sicurezza del tuo build_win.ps1
        run: |
          python -m venv .venv
          .\.venv\Scripts\Activate.ps1
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile using build_win.ps1
        run: |
          .\.venv\Scripts\Activate.ps1
          .\build_win.ps1

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/Ae_Thicc_Launcher_Windows.zip
            dist/Ae_Thicc_Launcher_Setup.exe
          retention-days: 1
  # ==========================================
  # 2. BUILD LINUX (Flatpak su Fedora 38)
  # ==========================================
  build-flatpak:
    if: startsWith(github.event.head_commit.message, 'Release_')
    runs-on: ubuntu-latest
    # Diciamo a GitHub di far girare questo job dentro un container Fedora 38
    container:
      image: fedora:38
      options: --privileged
    steps:
      - name: Pre-install Git and System Deps
        # Aggiungiamo le librerie di base che servono a PyQt6 durante la compilazione
        run: dnf install -y git nodejs python3 python3-pip mesa-libGL glib2-devel nss binutils

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Environment & Compile Linux Binary
        # Installiamo le librerie e usiamo PyInstaller direttamente su Linux
        run: |
          pip3 install -r requirements.txt
          pip3 install pyinstaller
          pyinstaller --noconsole --onefile --clean --name AeThiccLauncher \
            --collect-all "curl_cffi" \
            --collect-all "certifi" \
            --collect-all "keyring" \
            --collect-all "secretstorage" \
            --hidden-import "PyQt6.QtWebEngineWidgets" \
            --hidden-import "PyQt6.QtWebEngineCore" \
            main.py
          # Spostiamo il file compilato dalla cartella dist/ alla root
          cp dist/AeThiccLauncher aethicc-flatpak/AeThiccLauncher
          cp -r .media aethicc-flatpak/.media
          cp -r bin aethicc-flatpak/bin
          mkdir -p aethicc-flatpak/data
          cp -r data/. aethicc-flatpak/data/
          cp -r lists aethicc-flatpak/lists

      - name: Setup Flatpak Environment
        run: |
          dnf install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Build and Bundle Flatpak
        run: |
          flatpak-builder --repo=repo build-dir aethicc-flatpak/com.MJK.AeThiccLauncher.yml --force-clean --install-deps-from=flathub
          flatpak build-bundle repo Ae_Thicc_Launcher_Linux.flatpak com.MJK.AeThiccLauncher

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-build
          path: Ae_Thicc_Launcher_Linux.flatpak
          retention-days: 1
          
  # ==========================================
  # 3. PUBLISH RELEASE AL REPO PUBBLICO
  # ==========================================
  publish-release:
    # Aspetta che Windows e Linux abbiano finito la compilazione
    needs: [build-windows, build-flatpak]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Download Flatpak Artifact
        uses: actions/download-artifact@v4
        with:
          name: flatpak-build

      - name: Extract Version from Commit Message
        id: get_version
        run: |
          # Estrapola la stringa dopo "Release_" ignorando maiuscole/minuscole
          # Il messaggio arriva via env: interpolarlo nel bash si rompe con le virgolette.
          VERSION=$(printf '%s' "$COMMIT_MSG" | grep -ioP '(?<=Release_)\S+' | head -n 1 || true)
          if [ -z "$VERSION" ]; then VERSION="latest"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}

      - name: Extract changelog section
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = os.environ["VERSION"].lstrip("v")
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"^##\s+v?{re.escape(version)}\b.*?(?=^##\s|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(text)
          if match:
              body = match.group(0).strip()
              body = re.sub(r"^##\s+.*\n", "", body, count=1).strip()
          else:
              body = f"Release {version}"
          Path("release_notes.md").write_text(body + "\n", encoding="utf-8")
          print(body[:300])
          PY

      - name: Push Release to Public Repo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: "Ae Thicc Launcher v${{ env.VERSION }}"
          body_path: release_notes.md
          files: |
            Ae_Thicc_Launcher_Windows.zip
            Ae_Thicc_Launcher_Setup.exe
            Ae_Thicc_Launcher_Linux.flatpak
