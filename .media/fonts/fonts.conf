<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Qt 6.11 cannot rasterize COLRv1 colour emoji (Noto Color Emoji on
       Fedora/Nobara), so emoji-presentation characters (the UI icons) render
       as blank glyphs: Qt prefers that font over the bundled monochrome
       Noto Emoji. Reject it inside the app process so the fallback uses the
       shipped font. The system configuration is included unchanged. -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family"><string>Noto Color Emoji</string></patelt>
      </pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
